version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_password123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      /bin/bash -c "
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P Your_password123! -C -Q 'CREATE DATABASE manage_cars' || true
      "

  auth-service:
    build: ./backend/auth-service
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=manage_cars;encrypt=true;trustServerCertificate=true
      - DB_DRIVER=com.microsoft.sqlserver.jdbc.SQLServerDriver
      - DB_USERNAME=sa
      - DB_PASSWORD=Your_password123!
      - DB_DIALECT=org.hibernate.dialect.SQLServerDialect
    depends_on:
      db-init:
        condition: service_completed_successfully

  car-service:
    build: ./backend/car-service
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=manage_cars;encrypt=true;trustServerCertificate=true
      - DB_DRIVER=com.microsoft.sqlserver.jdbc.SQLServerDriver
      - DB_USERNAME=sa
      - DB_PASSWORD=Your_password123!
      - DB_DIALECT=org.hibernate.dialect.SQLServerDialect
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started

  frontend:
    build: ./frontend/manage-cars-front
    ports:
      - "4200:80"
    depends_on:
      - auth-service
      - car-service

volumes:
  sqlserver_data:
