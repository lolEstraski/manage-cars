server.port=8080

spring.application.name=auth-service

# Database Configuration with Environment Variables (Defaults to H2 for local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# To run with SQL Server locally, set these environment variables:
# DB_URL=jdbc:sqlserver://localhost:1433;databaseName=manage_cars;encrypt=true;trustServerCertificate=true
# DB_DRIVER=com.microsoft.sqlserver.jdbc.SQLServerDriver
# DB_USERNAME=sa
# DB_PASSWORD=Your_password123
# DB_DIALECT=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=94a08da1fecbb6e8b46990538c7b50b2401d81f21d3f9b2c8a14b62d8b5e4f3a7a9d0c1b4e2f5b6a7d8c9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0
